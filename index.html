<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Schedule Calendar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root {
            --bg: #0f111a;
            --surface: #1a1d2e;
            --surface-2: #232740;
            --surface-hover: #2a2f4a;
            --border: #2e3350;
            --text: #e8eaf0;
            --text-dim: #8b90a8;
            --accent: #6c7ee1;
            --accent-hover: #5a6dd0;

            --green: #22c55e;
            --green-bg: #0d3320;
            --green-border: #166534;
            --yellow: #eab308;
            --yellow-bg: #332d00;
            --yellow-border: #665a00;
            --red: #ef4444;
            --red-bg: #3b1111;
            --red-border: #7f1d1d;
            --purple: #a855f7;
            --purple-bg: #2d1252;
            --purple-border: #581c87;
            --blue: #3b82f6;
            --blue-bg: #0c1e3d;
            --blue-border: #1e3a6e;
            --pink: #ec4899;
            --pink-bg: #3b0d24;
            --pink-border: #831843;
            --cyan: #22d3ee;
            --cyan-bg: #083344;
            --cyan-border: #155e75;
            --orange: #f97316;
            --orange-bg: #3b1a06;
            --orange-border: #7c2d12;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        /* ── Top Bar ─────────────────────────────────── */
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 28px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .topbar-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .logo {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--accent), #a78bfa);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 16px;
            color: #fff;
        }

        .topbar h1 {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        .month-nav {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--surface-2);
            border-radius: 10px;
            padding: 4px;
            border: 1px solid var(--border);
        }

        .month-nav button {
            padding: 8px 14px;
            border: none;
            background: transparent;
            color: var(--text-dim);
            border-radius: 7px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            font-family: inherit;
            transition: all 0.15s;
        }

        .month-nav button:hover {
            background: var(--surface-hover);
            color: var(--text);
        }

        .month-nav .month-label {
            font-size: 14px;
            font-weight: 700;
            min-width: 170px;
            text-align: center;
            color: var(--text);
        }

        .topbar-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn {
            padding: 9px 18px;
            border: 1px solid var(--border);
            background: var(--surface-2);
            color: var(--text);
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            font-family: inherit;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .btn:hover {
            background: var(--surface-hover);
            border-color: var(--accent);
        }

        .btn-primary {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }

        .btn-primary:hover {
            background: var(--accent-hover);
        }

        .btn-excel {
            background: #166534;
            border-color: #22c55e;
            color: #22c55e;
        }

        .btn-excel:hover {
            background: #15803d;
            border-color: #4ade80;
        }

        .btn svg {
            width: 15px;
            height: 15px;
            flex-shrink: 0;
        }

        /* ── Status Bar ──────────────────────────────── */
        .status-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 28px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            overflow-x: auto;
        }

        .status-chip {
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
            border: 1px solid;
            cursor: default;
            transition: transform 0.1s;
        }

        .status-chip:hover {
            transform: scale(1.03);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .chip-wo  { background: var(--green-bg);  border-color: var(--green-border);  color: var(--green); }
        .chip-wo .status-dot  { background: var(--green); }
        .chip-pc  { background: var(--yellow-bg); border-color: var(--yellow-border); color: var(--yellow); }
        .chip-pc .status-dot  { background: var(--yellow); }
        .chip-al  { background: var(--red-bg);    border-color: var(--red-border);    color: var(--red); }
        .chip-al .status-dot  { background: var(--red); }
        .chip-do  { background: var(--orange-bg); border-color: var(--orange-border); color: var(--orange); }
        .chip-do .status-dot  { background: var(--orange); }
        .chip-oc  { background: var(--purple-bg); border-color: var(--purple-border); color: var(--purple); }
        .chip-oc .status-dot  { background: var(--purple); }
        .chip-ncr { background: var(--blue-bg);   border-color: var(--blue-border);   color: var(--blue); }
        .chip-ncr .status-dot { background: var(--blue); }
        .chip-icu { background: var(--pink-bg);   border-color: var(--pink-border);   color: var(--pink); }
        .chip-icu .status-dot { background: var(--pink); }
        .chip-misc { background: var(--cyan-bg);  border-color: var(--cyan-border);  color: var(--cyan); }
        .chip-misc .status-dot { background: var(--cyan); }

        /* ── Calendar Grid ───────────────────────────── */
        .calendar-wrap {
            padding: 20px 28px;
            overflow-x: auto;
        }

        .calendar-container {
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1100px;
        }

        /* Header row */
        thead th {
            background: var(--surface-2);
            color: var(--text-dim);
            padding: 10px 2px;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            text-align: center;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        thead th .day-num {
            display: block;
            font-size: 14px;
            font-weight: 700;
            color: var(--text);
            margin-top: 2px;
            letter-spacing: 0;
        }

        thead th:first-child {
            text-align: left;
            padding-left: 16px;
            min-width: 180px;
            position: sticky;
            left: 0;
            z-index: 11;
            font-size: 11px;
            letter-spacing: 0.8px;
        }

        thead th.weekend {
            background: rgba(99, 102, 241, 0.06);
        }

        thead th.weekend .day-num {
            color: var(--accent);
        }

        thead th.today-col {
            background: rgba(99, 102, 241, 0.12);
        }

        thead th.today-col .day-num {
            color: var(--accent);
            background: var(--accent);
            color: #fff;
            width: 24px;
            height: 24px;
            line-height: 24px;
            border-radius: 50%;
            display: inline-block;
        }

        thead th.sortable {
            cursor: pointer;
            user-select: none;
        }

        thead th.sortable:hover {
            background: rgba(99, 102, 241, 0.18);
        }

        thead th.sorted {
            background: rgba(99, 102, 241, 0.22);
        }

        thead th.sorted::after {
            content: ' \25BC';
            font-size: 8px;
        }

        /* Body rows */
        tbody tr {
            border-bottom: 1px solid var(--border);
            transition: background 0.1s;
        }

        tbody tr:last-child {
            border-bottom: none;
        }

        tbody tr:hover {
            background: var(--surface-hover);
        }

        tbody td {
            padding: 3px 2px;
            text-align: center;
            vertical-align: middle;
            position: relative;
        }

        tbody td:first-child {
            text-align: left;
            padding: 8px 16px;
            position: sticky;
            left: 0;
            background: var(--surface);
            z-index: 5;
            border-right: 1px solid var(--border);
        }

        tbody tr:hover td:first-child {
            background: var(--surface-hover);
        }

        tbody td.weekend-cell {
            background: rgba(99, 102, 241, 0.03);
        }

        tbody td.today-cell {
            background: rgba(99, 102, 241, 0.06);
        }

        /* Name cell */
        .name-cell {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 800;
            color: #fff;
            flex-shrink: 0;
            letter-spacing: 0.3px;
        }

        .name-info {
            display: flex;
            flex-direction: column;
        }

        .name-text {
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
            white-space: nowrap;
        }

        .name-id {
            font-size: 11px;
            color: var(--text-dim);
            font-weight: 500;
        }

        /* ── Shift Dropdown ──────────────────────────── */
        .shift-select {
            width: 40px;
            height: 28px;
            padding: 0;
            border: 1px solid transparent;
            border-radius: 6px;
            font-size: 10px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            text-align: center;
            text-align-last: center;
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            transition: all 0.12s;
            letter-spacing: 0.3px;
        }

        .shift-select:hover {
            transform: scale(1.08);
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        .shift-select:focus {
            outline: none;
            box-shadow: 0 0 0 2px var(--accent), 0 2px 8px rgba(0,0,0,0.3);
        }

        /* Shift cell colors */
        .shift-none { background: var(--surface-2); color: var(--text-dim); border-color: var(--border); }
        .shift-wo   { background: var(--green);  color: #fff; }
        .shift-pc   { background: var(--yellow); color: #1a1a1a; }
        .shift-al   { background: var(--red);    color: #fff; }
        .shift-do   { background: var(--orange); color: #fff; }
        .shift-oc   { background: var(--purple); color: #fff; }
        .shift-ncr  { background: var(--blue);   color: #fff; }
        .shift-icu  { background: var(--pink);   color: #fff; }
        .shift-misc { background: var(--cyan);   color: #1a1a1a; }

        /* PDF static cell */
        .pdf-cell {
            display: none;
            font-size: 10px;
            font-weight: 700;
            padding: 4px 3px;
            border-radius: 5px;
            letter-spacing: 0.3px;
        }

        /* ── Responsive ──────────────────────────────── */
        @media (max-width: 768px) {
            .topbar { flex-wrap: wrap; gap: 12px; padding: 12px 16px; }
            .status-bar { padding: 10px 16px; }
            .calendar-wrap { padding: 12px 16px; }
            .topbar h1 { font-size: 16px; }
        }

        @media print {
            .shift-select { display: none !important; }
            .pdf-cell { display: inline-block !important; }
            .topbar { box-shadow: none; }
            .btn { display: none !important; }
        }

        /* ── Export animation ────────────────────────── */
        .btn-primary.exporting {
            pointer-events: none;
            opacity: 0.7;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .btn-primary.exporting span {
            animation: pulse 1.2s infinite;
        }
    </style>
</head>
<body>
    <div id="app">
        <!-- Top Bar -->
        <div class="topbar">
            <div class="topbar-left">
                <div class="logo">SC</div>
                <h1>Staff Schedule</h1>
            </div>
            <div class="month-nav">
                <button onclick="changeMonth(-1)">
                    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px"><path d="M10 12L6 8l4-4"/></svg>
                </button>
                <span class="month-label" id="monthLabel"></span>
                <button onclick="changeMonth(1)">
                    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px"><path d="M6 4l4 4-4 4"/></svg>
                </button>
            </div>
            <div class="topbar-right">
                <button class="btn" onclick="jumpToToday()">
                    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="3" width="12" height="11" rx="2"/><path d="M2 7h12M5 1v4M11 1v4"/></svg>
                    Today
                </button>
                <button class="btn btn-excel" onclick="exportExcel()">
                    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 12h8M8 2v7M5 6l3 3 3-3"/></svg>
                    <span>Export Excel</span>
                </button>
                <button class="btn btn-primary" id="exportBtn" onclick="exportPDF()">
                    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 12h8M8 2v7M5 6l3 3 3-3"/></svg>
                    <span>Export PDF</span>
                </button>
            </div>
        </div>

        <!-- Status Bar (ordered: Green, Yellow, Red, then others) -->
        <div class="status-bar" id="statusBar"></div>

        <!-- Calendar -->
        <div class="calendar-wrap">
            <div class="calendar-container">
                <table>
                    <thead id="calendarHead"></thead>
                    <tbody id="calendarBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // ── Data ──────────────────────────────────────────────
        const staff = [
            { id: 'JB', name: 'Jeff Burnette',       color: '#e74c3c' },
            { id: 'KP', name: 'Kim Payne',           color: '#9b59b6' },
            { id: 'GB', name: 'Gavin Broderick',     color: '#e67e22' },
            { id: 'AM', name: 'Angel Mahan',         color: '#3498db' },
            { id: 'W',  name: 'Will Cramer',         color: '#27ae60' },
            { id: 'EN', name: 'Emily Nelson',        color: '#eab308' },
            { id: 'DK', name: 'Don Kilpatrick',      color: '#ec4899' },
            { id: 'RC', name: 'Robert Christopher',  color: '#22d3ee' },
            { id: 'SH', name: 'Samantha Hansen',     color: '#14b8a6' },
            { id: 'JT', name: 'Jenny Thompson',      color: '#22c55e' },
            { id: 'TS', name: 'Tomas Szabo',         color: '#a855f7' }
        ];

        // Ordered: green, yellow, red, then the rest
        const shiftTypes = [
            { code: '',     label: '--',              cssClass: 'shift-none', chipClass: '',          color: 'var(--surface-2)', textColor: 'var(--text-dim)' },
            { code: 'WO',   label: 'Working',         cssClass: 'shift-wo',   chipClass: 'chip-wo',   color: 'var(--green)',  textColor: '#fff' },
            { code: 'PC',   label: 'Post Call',       cssClass: 'shift-pc',   chipClass: 'chip-pc',   color: 'var(--yellow)', textColor: '#1a1a1a' },
            { code: 'AL',   label: 'Annual Leave',    cssClass: 'shift-al',   chipClass: 'chip-al',   color: 'var(--red)',    textColor: '#fff' },
            { code: 'DO',   label: 'Day Off',         cssClass: 'shift-do',   chipClass: 'chip-do',   color: 'var(--orange)', textColor: '#fff' },
            { code: 'OC',   label: 'On Call',         cssClass: 'shift-oc',   chipClass: 'chip-oc',   color: 'var(--purple)', textColor: '#fff' },
            { code: 'NCR',  label: 'No Call Request', cssClass: 'shift-ncr',  chipClass: 'chip-ncr',  color: 'var(--blue)',   textColor: '#fff' },
            { code: 'ICU',  label: 'ICU',             cssClass: 'shift-icu',  chipClass: 'chip-icu',  color: 'var(--pink)',   textColor: '#fff' },
            { code: 'MISC', label: 'Misc',            cssClass: 'shift-misc', chipClass: 'chip-misc', color: 'var(--cyan)',   textColor: '#1a1a1a' }
        ];

        const dayNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
        const monthNames = [
            'January','February','March','April','May','June',
            'July','August','September','October','November','December'
        ];

        // ── State ─────────────────────────────────────────────
        let currentYear = new Date().getFullYear();
        let currentMonth = new Date().getMonth();
        let scheduleData = JSON.parse(localStorage.getItem('scheduleData') || '{}');
        let sortedDay = null; // which day column is currently sorted

        // Sort priority: green first, yellow second, red third, then others, unset last
        const sortPriority = { 'WO': 0, 'PC': 1, 'AL': 2, 'DO': 3, 'OC': 4, 'NCR': 5, 'ICU': 6, 'MISC': 7, '': 99 };

        // ── Status Bar ───────────────────────────────────────
        function buildStatusBar() {
            const bar = document.getElementById('statusBar');
            bar.innerHTML = shiftTypes.filter(s => s.code).map(s =>
                `<div class="status-chip ${s.chipClass}">
                    <span class="status-dot"></span>
                    ${s.code} &mdash; ${s.label}
                </div>`
            ).join('');
        }

        // ── Calendar ─────────────────────────────────────────
        function getDaysInMonth(year, month) {
            return new Date(year, month + 1, 0).getDate();
        }

        function buildCalendar() {
            const days = getDaysInMonth(currentYear, currentMonth);
            const today = new Date();

            document.getElementById('monthLabel').textContent =
                `${monthNames[currentMonth]} ${currentYear}`;

            // Header
            let headHTML = '<tr><th>STAFF MEMBER</th>';
            for (let d = 1; d <= days; d++) {
                const date = new Date(currentYear, currentMonth, d);
                const dayName = dayNames[date.getDay()];
                const isWeekend = date.getDay() === 0 || date.getDay() === 6;
                const isToday = date.toDateString() === today.toDateString();
                const isSorted = sortedDay === d;
                headHTML += `<th class="sortable ${isWeekend ? 'weekend' : ''} ${isToday ? 'today-col' : ''} ${isSorted ? 'sorted' : ''}" onclick="sortByDay(${d})">${dayName}<span class="day-num">${d}</span></th>`;
            }
            headHTML += '</tr>';
            document.getElementById('calendarHead').innerHTML = headHTML;

            // Sort staff if a day is selected
            let sortedStaff = [...staff];
            if (sortedDay !== null) {
                const dateStr = `${currentYear}-${String(currentMonth+1).padStart(2,'0')}-${String(sortedDay).padStart(2,'0')}`;
                sortedStaff.sort((a, b) => {
                    const aShift = scheduleData[`${a.id}-${dateStr}`] || '';
                    const bShift = scheduleData[`${b.id}-${dateStr}`] || '';
                    return (sortPriority[aShift] ?? 50) - (sortPriority[bShift] ?? 50);
                });
            }

            // Body
            let bodyHTML = '';
            sortedStaff.forEach(person => {
                bodyHTML += '<tr>';
                bodyHTML += `<td>
                    <div class="name-cell">
                        <div class="avatar" style="background:${person.color}">${person.id}</div>
                        <div class="name-info">
                            <span class="name-text">${person.name}</span>
                            <span class="name-id">${person.id}</span>
                        </div>
                    </div>
                </td>`;

                for (let d = 1; d <= days; d++) {
                    const dateStr = `${currentYear}-${String(currentMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                    const key = `${person.id}-${dateStr}`;
                    const savedVal = scheduleData[key] || '';
                    const date = new Date(currentYear, currentMonth, d);
                    const isToday = date.toDateString() === today.toDateString();
                    const isWeekend = date.getDay() === 0 || date.getDay() === 6;

                    const shift = shiftTypes.find(s => s.code === savedVal) || shiftTypes[0];

                    let options = shiftTypes.map(s =>
                        `<option value="${s.code}" ${s.code === savedVal ? 'selected' : ''}>${s.code || '--'}</option>`
                    ).join('');

                    const cellClass = isToday ? 'today-cell' : (isWeekend ? 'weekend-cell' : '');

                    bodyHTML += `<td class="${cellClass}">
                        <select class="shift-select ${shift.cssClass}"
                                data-key="${key}"
                                onchange="onShiftChange(this)">
                            ${options}
                        </select>
                        <span class="pdf-cell" style="background:${shift.color};color:${shift.textColor}">${savedVal || '-'}</span>
                    </td>`;
                }
                bodyHTML += '</tr>';
            });
            document.getElementById('calendarBody').innerHTML = bodyHTML;
        }

        function onShiftChange(el) {
            const key = el.dataset.key;
            const val = el.value;
            scheduleData[key] = val;
            localStorage.setItem('scheduleData', JSON.stringify(scheduleData));

            // If sorted day is active and this cell is on that day, re-sort
            if (sortedDay !== null) {
                const dayPart = parseInt(key.split('-').pop(), 10);
                if (dayPart === sortedDay) {
                    buildCalendar();
                    return;
                }
            }

            const shift = shiftTypes.find(s => s.code === val) || shiftTypes[0];
            el.className = 'shift-select ' + shift.cssClass;
            const pdfCell = el.nextElementSibling;
            pdfCell.style.background = shift.color;
            pdfCell.style.color = shift.textColor;
            pdfCell.textContent = val || '-';
        }

        function sortByDay(day) {
            if (sortedDay === day) {
                sortedDay = null; // click again to unsort
            } else {
                sortedDay = day;
            }
            buildCalendar();
        }

        function changeMonth(delta) {
            currentMonth += delta;
            if (currentMonth > 11) { currentMonth = 0; currentYear++; }
            if (currentMonth < 0) { currentMonth = 11; currentYear--; }
            sortedDay = null;
            buildCalendar();
        }

        function jumpToToday() {
            const now = new Date();
            currentYear = now.getFullYear();
            currentMonth = now.getMonth();
            buildCalendar();
        }

        // ── PDF Export ───────────────────────────────────────
        function exportPDF() {
            const btn = document.getElementById('exportBtn');
            btn.classList.add('exporting');
            btn.querySelector('span').textContent = 'Exporting...';

            document.querySelectorAll('.shift-select').forEach(el => el.style.display = 'none');
            document.querySelectorAll('.pdf-cell').forEach(el => el.style.display = 'inline-block');
            document.querySelectorAll('.btn').forEach(b => b.style.visibility = 'hidden');
            document.querySelectorAll('.month-nav button').forEach(b => b.style.visibility = 'hidden');

            const element = document.getElementById('app');
            const opt = {
                margin:       [5, 5, 5, 5],
                filename:     `Schedule_${monthNames[currentMonth]}_${currentYear}.pdf`,
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, scrollX: 0, scrollY: 0, useCORS: true, backgroundColor: '#0f111a' },
                jsPDF:        { unit: 'mm', format: 'a3', orientation: 'landscape' }
            };

            html2pdf().set(opt).from(element).save().then(() => {
                document.querySelectorAll('.shift-select').forEach(el => el.style.display = '');
                document.querySelectorAll('.pdf-cell').forEach(el => el.style.display = 'none');
                document.querySelectorAll('.btn').forEach(b => b.style.visibility = '');
                document.querySelectorAll('.month-nav button').forEach(b => b.style.visibility = '');
                btn.classList.remove('exporting');
                btn.querySelector('span').textContent = 'Export PDF';
            });
        }

        // ── Excel Export ─────────────────────────────────────
        function exportExcel() {
            const days = getDaysInMonth(currentYear, currentMonth);
            const rows = [];

            // Header row
            const header = ['Staff'];
            for (let d = 1; d <= days; d++) {
                const date = new Date(currentYear, currentMonth, d);
                header.push(`${dayNames[date.getDay()]} ${d}`);
            }
            rows.push(header);

            // Data rows
            staff.forEach(person => {
                const row = [person.name];
                for (let d = 1; d <= days; d++) {
                    const dateStr = `${currentYear}-${String(currentMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                    const key = `${person.id}-${dateStr}`;
                    const val = scheduleData[key] || '';
                    const shift = shiftTypes.find(s => s.code === val);
                    row.push(shift && shift.code ? `${shift.code} - ${shift.label}` : '');
                }
                rows.push(row);
            });

            const ws = XLSX.utils.aoa_to_sheet(rows);

            // Column widths
            ws['!cols'] = [{ wch: 22 }];
            for (let d = 1; d <= days; d++) {
                ws['!cols'].push({ wch: 18 });
            }

            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, `${monthNames[currentMonth]} ${currentYear}`);
            XLSX.writeFile(wb, `Schedule_${monthNames[currentMonth]}_${currentYear}.xlsx`);
        }

        // ── Init ─────────────────────────────────────────────
        buildStatusBar();
        buildCalendar();
    </script>
</body>
</html>
